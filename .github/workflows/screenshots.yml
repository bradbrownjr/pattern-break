name: Screenshots

# Regenerates docs/img/ from the manifest (tools/screenshots/shots.ts) on every release and
# opens a pull request if any figure changed. A person reviews and merges it.
# Needs the repository setting "Allow GitHub Actions to create and approve pull requests".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm screenshots
      - name: Open a pull request if the figures changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER: ${{ github.event_name == 'release' && format('release {0}', github.event.release.tag_name) || 'a manual run' }}
        run: |
          if [ -z "$(git status --porcelain -- docs/img)" ]; then
            echo "Figures are unchanged."
            exit 0
          fi
          branch="screenshots/run-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/img
          git commit -m "Update screenshots (${TRIGGER})"
          git push origin "$branch"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "Update screenshots (${TRIGGER})" \
            --body "Regenerated by pnpm screenshots from the manifest. Review the changed images before merging."
