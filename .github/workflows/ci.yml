name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:docs
      - run: pnpm check:music
      - run: pnpm build

  # The golden LevelData hashes must come out the same in every browser engine as in Node.
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @game/analysis exec playwright install --with-deps chromium firefox webkit
      # Firefox's live AudioContext never leaves "suspended" without a sound server to play
      # into, and the runner has none. PulseAudio's default.pa loads module-always-sink, so
      # with no sound card it plays into a null sink.
      - name: Start a sound server
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl info
      - run: pnpm test:browser
        env:
          PB_BROWSERS: chromium,firefox,webkit
